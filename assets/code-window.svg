<svg width="640" height="350" viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="640" height="350" rx="14" fill="#1e1e2e"/>
  <line x1="0" y1="36" x2="640" y2="36" stroke="#33344a" stroke-width="1"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="18" r="6" fill="#27c93f"/>
  <text x="320" y="23" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#8a8ca5">main.go</text>

  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="14" fill="#d4d4dc">
    <text x="20" y="66"><tspan fill="#c792ea">package</tspan> main</text>
    <text x="20" y="86"></text>
    <text x="20" y="106"><tspan fill="#c792ea">import</tspan> <tspan fill="#a3e635">"fmt"</tspan></text>
    <text x="20" y="126"></text>
    <text x="20" y="146"><tspan fill="#6a9955">// Don't communicate by sharing memory,</tspan></text>
    <text x="20" y="166"><tspan fill="#6a9955">// share memory by communicating. — Rob Pike</tspan></text>
    <text x="20" y="186"></text>
    <text x="20" y="206"><tspan fill="#c792ea">func</tspan> <tspan fill="#82aaff">main</tspan>() {</text>
    <text x="20" y="226">    ch := make(<tspan fill="#c792ea">chan</tspan> <tspan fill="#c792ea">string</tspan>)</text>
    <text x="20" y="246">    <tspan fill="#c792ea">go</tspan> <tspan fill="#c792ea">func</tspan>() {</text>
    <text x="20" y="266">        ch &lt;- <tspan fill="#a3e635">"Hello, 世界"</tspan></text>
    <text x="20" y="286">    }()</text>
    <text x="20" y="306">    fmt.Println(&lt;-ch)</text>
    <text x="20" y="326">}</text>
  </g>
</svg>
